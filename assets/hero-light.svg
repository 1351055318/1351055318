<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="420" viewBox="0 0 1260 420" fill="none" role="img" aria-label="KeepAlive — Linux 运维 · 全栈工具开发">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1260" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.14" cy="0.02" r="0.92">
      <stop offset="0" stop-color="#0969da" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0.96" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#8250df" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="0.5" stop-color="#8250df"/>
      <stop offset="1" stop-color="#1b7c83"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2328"/>
      <stop offset="0.40" stop-color="#0969da"/>
      <stop offset="0.64" stop-color="#8250df"/>
      <stop offset="1" stop-color="#1f2328"/>
      <animate attributeName="x1" values="-0.7;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.3;2" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0969da" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#eef1f5" stroke-width="1"/>
    </pattern>

    <clipPath id="card"><rect width="1260" height="420" rx="18"/></clipPath>

    <clipPath id="wipeA">
      <rect x="0" y="0" width="0" height="420">
        <animate attributeName="width" from="0" to="840" dur="1.7s" begin="0.25s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="wipeB">
      <rect x="0" y="0" width="0" height="420">
        <animate attributeName="width" from="0" to="680" dur="1.5s" begin="1.15s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="wipeC">
      <rect x="0" y="0" width="0" height="420">
        <animate attributeName="width" from="0" to="760" dur="1.3s" begin="1.85s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1260" height="420" fill="url(#bg)"/>
    <rect width="1260" height="420" fill="url(#grid)"/>
    <rect width="1260" height="420" fill="url(#glowA)"/>
    <rect width="1260" height="420" fill="url(#glowB)"/>

    <rect x="0" y="0" width="1260" height="2.5" fill="url(#edge)" opacity="0.85">
      <animate attributeName="opacity" values="0.45;0.9;0.45" dur="3.4s" repeatCount="indefinite"/>
    </rect>

    <rect y="0" width="170" height="420" fill="url(#sheen)" opacity="0.7">
      <animate attributeName="x" from="-240" to="1340" dur="6.4s" begin="2.4s" repeatCount="indefinite"/>
    </rect>

    <g clip-path="url(#wipeA)">
      <text x="64" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="5" fill="#0969da">&#62; whoami</text>
      <text x="64" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="100" font-weight="700" fill="url(#titleGrad)">KeepAlive</text>
    </g>

    <g clip-path="url(#wipeB)">
      <line x1="64" y1="216" x2="424" y2="216" stroke="url(#edge)" stroke-width="1.5" opacity="0.5"/>
      <text x="64" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="600" fill="#1f2328">Linux 运维 · 全栈工具开发</text>
    </g>

    <g clip-path="url(#wipeC)">
      <text x="64" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#57606a">把重复劳动写成脚本，把想法做成能跑的东西。</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#57606a">
      <circle cx="68" cy="356" r="3.4" fill="#1a7f37">
        <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="84" y="360" fill="#1a7f37">AVAILABLE FOR WORK</text>

      <text x="300" y="360" fill="#d0d7de">|</text>
      <text x="328" y="360">17 repos</text>
      <text x="424" y="360" fill="#d0d7de">|</text>
      <text x="452" y="360">6 languages</text>
      <text x="580" y="360" fill="#d0d7de">|</text>
      <text x="608" y="360">since 2021</text>
    </g>

    <g>
      <g stroke="#c8d1dc" stroke-width="1.6" opacity="0.9" stroke-linecap="round">
        <path d="M1000 176 V128"/>
        <path d="M928 208 H892"/>
        <path d="M1016 240 V296"/>
        <path d="M1064 240 L1100 296"/>
      </g>

      <g>
        <circle r="3" fill="#0969da">
          <animateMotion dur="2.8s" repeatCount="indefinite" path="M1000,176 V128"/>
          <animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle r="3" fill="#0969da">
          <animateMotion dur="3.4s" begin="0.4s" repeatCount="indefinite" path="M1000,128 V176"/>
          <animate attributeName="opacity" values="0.25;1;0.25" dur="3.4s" repeatCount="indefinite"/>
        </circle>
        <circle r="2.6" fill="#1a7f37">
          <animateMotion dur="3s" begin="0.9s" repeatCount="indefinite" path="M928,208 H892"/>
        </circle>
        <circle r="2.6" fill="#8250df">
          <animateMotion dur="3.6s" begin="0.2s" repeatCount="indefinite" path="M1016,240 V296"/>
        </circle>
        <circle r="2.6" fill="#8250df">
          <animateMotion dur="4.2s" begin="1.2s" repeatCount="indefinite" path="M1064,240 L1100,296"/>
        </circle>
      </g>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
        <rect x="944" y="84" width="112" height="44" rx="10" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.4"/>
        <text x="1000" y="111" font-size="13" fill="#0969da">PXE</text>

        <rect x="790" y="186" width="102" height="44" rx="10" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.4"/>
        <text x="841" y="213" font-size="13" fill="#1a7f37">WEB</text>

        <rect x="930" y="176" width="140" height="64" rx="12" fill="#ffffff" stroke="url(#edge)" stroke-width="2"/>
        <text x="1000" y="205" font-size="14" fill="#1f2328" font-weight="700">CORE</text>
        <text x="1000" y="224" font-size="10.5" fill="#8c959f">infra node</text>

        <rect x="960" y="296" width="112" height="44" rx="10" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.4"/>
        <text x="1016" y="323" font-size="13" fill="#8250df">CEPH</text>

        <rect x="1100" y="296" width="112" height="44" rx="10" fill="#ffffff" stroke="#b8c4d4" stroke-width="1.4"/>
        <text x="1156" y="323" font-size="13" fill="#1b7c83">TOOL</text>
      </g>
    </g>
  </g>
</svg>
