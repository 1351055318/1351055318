        <rect x="80" y="60" width="40" height="40" rx="10" fill="#0969da" opacity="0.12"/>
        <circle cx="100" cy="80" r="7" fill="#0969da"/>
        <text x="144" y="78" font-size="18" font-weight="600" fill="#1f2328">基础设施自动化</text>
        <text x="144" y="104" font-size="14.5" fill="#57606a">PXE 网络批量装机 · 服务器初始化 · 配置下发</text>
        <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.10s" fill="freeze"/>
      </g>

      <g opacity="0">
        <rect x="636" y="34" width="568" height="92" rx="12" fill="#f6f8fa" stroke="#e1e6eb" stroke-width="1.2"/>
        <rect x="660" y="60" width="40" height="40" rx="10" fill="#8250df" opacity="0.12"/>
        <rect x="676" y="72" width="8" height="16" rx="2" fill="#8250df"/>
        <rect x="690" y="66" width="8" height="22" rx="2" fill="#8250df"/>
        <text x="724" y="78" font-size="18" font-weight="600" fill="#1f2328">存储与虚拟化</text>
        <text x="724" y="104" font-size="14.5" fill="#57606a">Ceph 分布式存储实验 · 节点扩容 · 故障演练</text>
        <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.22s" fill="freeze"/>
      </g>

      <g opacity="0">
        <rect x="56" y="146" width="568" height="92" rx="12" fill="#f6f8fa" stroke="#e1e6eb" stroke-width="1.2"/>
        <rect x="80" y="172" width="40" height="40" rx="10" fill="#1b7c83" opacity="0.12"/>
        <rect x="92" y="182" width="6" height="20" rx="2" fill="#1b7c83"/>
        <rect x="102" y="188" width="6" height="14" rx="2" fill="#1b7c83"/>
        <rect x="112" y="178" width="6" height="24" rx="2" fill="#1b7c83"/>
        <text x="144" y="190" font-size="18" font-weight="600" fill="#1f2328">Web 与可视化</text>
        <text x="144" y="216" font-size="14.5" fill="#57606a">数字化大屏 · 云盘类应用 · 协作平台前端</text>
        <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.34s" fill="freeze"/>
      </g>

      <g opacity="0">
        <rect x="636" y="146" width="568" height="92" rx="12" fill="#f6f8fa" stroke="#e1e6eb" stroke-width="1.2"/>
        <rect x="660" y="172" width="40" height="40" rx="10" fill="#1a7f37" opacity="0.12"/>
        <path d="M670 196 L678 182 L686 196 Z" fill="#1a7f37"/>
        <circle cx="678" cy="198" r="3" fill="#1a7f37"/>
        <text x="724" y="190" font-size="18" font-weight="600" fill="#1f2328">工具与脚本</text>
        <text x="724" y="216" font-size="14.5" fill="#57606a">天气、汇率、推送机器人等日常效率工具</text>
        <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.46s" fill="freeze"/>
