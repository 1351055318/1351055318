<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="250" viewBox="0 0 1260 250" fill="none" role="img" aria-label="What I do">
  <defs>
    <clipPath id="acard"><rect width="1260" height="250" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#acard)">
    <rect width="1260" height="250" fill="#ffffff"/>
    <rect x="0.75" y="0.75" width="1258.5" height="248.5" rx="16" stroke="#d0d7de" stroke-width="1.5" fill="none"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

      <g opacity="0">
