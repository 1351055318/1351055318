<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="76" viewBox="0 0 1260 76" fill="none" role="img" aria-label="02 精选项目">
  <defs>
    <linearGradient id="sline" x1="0" y1="0" x2="1260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a7f37" stop-opacity="0.65"/>
      <stop offset="0.55" stop-color="#0969da" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#1b7c83" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="snum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a7f37"/>
      <stop offset="1" stop-color="#0969da"/>
    </linearGradient>
    <clipPath id="sw"><rect x="0" y="0" width="0" height="76"><animate attributeName="width" from="0" to="400" dur="1.1s" fill="freeze"/></rect></clipPath>
  </defs>

  <g clip-path="url(#sw)">
    <text x="56" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="url(#snum)">02</text>
    <text x="126" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" font-weight="600" fill="#1f2328">精选项目</text>
    <text x="262" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="3" fill="#8c959f">SELECTED WORK</text>
  </g>

  <line x1="470" y1="44" x2="470" y2="44" stroke="url(#sline)" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x2" from="470" to="1204" dur="1.5s" begin="0.35s" fill="freeze"/>
  </line>
</svg>
