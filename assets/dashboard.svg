<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="240" viewBox="0 0 1260 240" fill="none" role="img" aria-label="GitHub dashboard">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1260" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#0c1018"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#bb9af7"/>
      <animate attributeName="x1" values="-0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.5;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="dcard"><rect width="1260" height="240" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#dcard)">
    <rect width="1260" height="240" fill="url(#dbg)"/>
    <rect x="0.75" y="0.75" width="1258.5" height="238.5" rx="16" stroke="#1d2740" stroke-width="1.5" fill="none"/>

    <text x="56" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" letter-spacing="4" fill="#7aa2f7" opacity="0.85">// DASHBOARD</text>
    <line x1="56" y1="64" x2="1204" y2="64" stroke="#18213a" stroke-width="1"/>

    <g stroke="#18213a" stroke-width="1">
      <line x1="356" y1="86" x2="356" y2="156"/>
      <line x1="656" y1="86" x2="656" y2="156"/>
      <line x1="956" y1="86" x2="956" y2="156"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="56" y="132" font-size="48" font-weight="700" fill="url(#num)">17<animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.15s" fill="freeze"/></text>
      <text x="56" y="156" font-size="11.5" letter-spacing="2.5" fill="#565f89">REPOSITORIES</text>

      <text x="392" y="132" font-size="48" font-weight="700" fill="url(#num)">6<animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.28s" fill="freeze"/></text>
      <text x="392" y="156" font-size="11.5" letter-spacing="2.5" fill="#565f89">LANGUAGES</text>

      <text x="692" y="132" font-size="48" font-weight="700" fill="url(#num)">4<animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.41s" fill="freeze"/></text>
      <text x="692" y="156" font-size="11.5" letter-spacing="2.5" fill="#565f89">STARRED</text>

      <text x="992" y="132" font-size="48" font-weight="700" fill="url(#num)">2021<animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.54s" fill="freeze"/></text>
      <text x="992" y="156" font-size="11.5" letter-spacing="2.5" fill="#565f89">JOINED</text>
    </g>

    <rect x="56" y="182" width="1148" height="8" rx="4" fill="#141b2c"/>
    <g>
      <rect x="56" y="182" width="0" height="8" rx="3" fill="#f7df1e">
        <animate attributeName="width" from="0" to="270" dur="0.9s" begin="0.62s" fill="freeze"/>
      </rect>
      <rect x="326" y="182" width="0" height="8" rx="3" fill="#89e051">
        <animate attributeName="width" from="0" to="202" dur="0.9s" begin="0.76s" fill="freeze"/>
      </rect>
      <rect x="528" y="182" width="0" height="8" rx="3" fill="#3572a5">
        <animate attributeName="width" from="0" to="202" dur="0.9s" begin="0.90s" fill="freeze"/>
      </rect>
      <rect x="730" y="182" width="0" height="8" rx="3" fill="#3178c6">
        <animate attributeName="width" from="0" to="202" dur="0.9s" begin="1.04s" fill="freeze"/>
      </rect>
      <rect x="932" y="182" width="0" height="8" rx="3" fill="#565f89">
        <animate attributeName="width" from="0" to="272" dur="0.9s" begin="1.18s" fill="freeze"/>
      </rect>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#a9b1d6">
      <circle cx="62" cy="216" r="3.6" fill="#f7df1e"/>
      <text x="74" y="220">JavaScript 24%</text>

      <circle cx="248" cy="216" r="3.6" fill="#89e051"/>
      <text x="260" y="220">Shell 18%</text>

      <circle cx="392" cy="216" r="3.6" fill="#3572a5"/>
      <text x="404" y="220">Python 18%</text>

      <circle cx="548" cy="216" r="3.6" fill="#3178c6"/>
      <text x="560" y="220">TypeScript 18%</text>

      <circle cx="736" cy="216" r="3.6" fill="#565f89"/>
      <text x="748" y="220">Others 22%</text>
    </g>
  </g>
</svg>
