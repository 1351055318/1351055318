<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="30" viewBox="0 0 1260 30" fill="none" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#bb9af7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="15" x2="1260" y2="15" stroke="url(#dg)" stroke-width="1.5"/>
  <circle cx="0" cy="15" r="3" fill="#7dcfff">
    <animate attributeName="cx" values="0;1260" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1260" cy="15" r="2" fill="#bb9af7">
    <animate attributeName="cx" values="1260;0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.8;0.1" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
