<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="240" viewBox="0 0 1260 240" fill="none" role="img" aria-label="GitHub dashboard">
  <defs>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="1" stop-color="#8250df"/>
      <animate attributeName="x1" values="-0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.5;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="dcard"><rect width="1260" height="240" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#dcard)">
    <rect width="1260" height="240" fill="#ffffff"/>
    <rect x="0.75" y="0.75" width="1258.5" height="238.5" rx="16" stroke="#d0d7de" stroke-width="1.5" fill="none"/>

    <text x="56" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="4" fill="#0969da">// DASHBOARD</text>
    <line x1="56" y1="64" x2="1204" y2="64" stroke="#eaeef2" stroke-width="1.5"/>

    <g stroke="#eaeef2" stroke-width="1.5">
      <line x1="380" y1="86" x2="380" y2="160"/>
      <line x1="704" y1="86" x2="704" y2="160"/>
      <line x1="1028" y1="86" x2="1028" y2="160"/>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="56" y="134" font-size="52" font-weight="700" fill="url(#num)">17<animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.15s" fill="freeze"/></text>
      <text x="56" y="160" font-size="12.5" letter-spacing="2.5" fill="#57606a">REPOSITORIES</text>

      <text x="416" y="134" font-size="52" font-weight="700" fill="url(#num)">6<animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.28s" fill="freeze"/></text>
      <text x="416" y="160" font-size="12.5" letter-spacing="2.5" fill="#57606a">LANGUAGES</text>

      <text x="740" y="134" font-size="52" font-weight="700" fill="url(#num)">4<animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.41s" fill="freeze"/></text>
      <text x="740" y="160" font-size="12.5" letter-spacing="2.5" fill="#57606a">STARRED</text>

      <text x="1064" y="134" font-size="52" font-weight="700" fill="url(#num)">2021<animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.54s" fill="freeze"/></text>
      <text x="1064" y="160" font-size="12.5" letter-spacing="2.5" fill="#57606a">JOINED</text>
    </g>

    <rect x="56" y="184" width="1148" height="8" rx="4" fill="#eaeef2"/>
    <g>
      <rect x="56" y="184" width="0" height="8" rx="4" fill="#bf8700">
        <animate attributeName="width" from="0" to="270" dur="0.9s" begin="0.62s" fill="freeze"/>
      </rect>
      <rect x="326" y="184" width="0" height="8" rx="4" fill="#1a7f37">
        <animate attributeName="width" from="0" to="202" dur="0.9s" begin="0.76s" fill="freeze"/>
      </rect>
      <rect x="528" y="184" width="0" height="8" rx="4" fill="#0969da">
        <animate attributeName="width" from="0" to="202" dur="0.9s" begin="0.90s" fill="freeze"/>
      </rect>
      <rect x="730" y="184" width="0" height="8" rx="4" fill="#8250df">
        <animate attributeName="width" from="0" to="202" dur="0.9s" begin="1.04s" fill="freeze"/>
      </rect>
      <rect x="932" y="184" width="0" height="8" rx="4" fill="#8c959f">
        <animate attributeName="width" from="0" to="272" dur="0.9s" begin="1.18s" fill="freeze"/>
      </rect>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#57606a">
      <circle cx="62" cy="218" r="3.6" fill="#bf8700"/>
      <text x="74" y="222">JavaScript 24%</text>

      <circle cx="250" cy="218" r="3.6" fill="#1a7f37"/>
      <text x="262" y="222">Shell 18%</text>

      <circle cx="398" cy="218" r="3.6" fill="#0969da"/>
      <text x="410" y="222">Python 18%</text>

      <circle cx="556" cy="218" r="3.6" fill="#8250df"/>
      <text x="568" y="222">TypeScript 18%</text>

      <circle cx="748" cy="218" r="3.6" fill="#8c959f"/>
      <text x="760" y="222">Others 22%</text>
    </g>
  </g>
</svg>
