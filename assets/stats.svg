<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="260" viewBox="0 0 1260 260" fill="none" role="img" aria-label="GitHub overview">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1260" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff"/>
      <stop offset="1" stop-color="#bb9af7"/>
      <animate attributeName="x1" values="-0.5;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.5;2" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="scard"><rect width="1260" height="260" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#scard)">
    <rect width="1260" height="260" fill="url(#sbg)"/>
    <rect x="0.75" y="0.75" width="1258.5" height="258.5" rx="16" stroke="#1f2a44" stroke-width="1.5" fill="none"/>

    <text x="56" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="4" fill="#7aa2f7" opacity="0.85">// OVERVIEW</text>
    <line x1="56" y1="66" x2="1204" y2="66" stroke="#1b2440" stroke-width="1"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="56" y="134" font-size="56" font-weight="700" fill="url(#num)">
        17
        <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.15s" fill="freeze"/>
      </text>
      <text x="56" y="160" font-size="12" letter-spacing="3" fill="#565f89">REPOSITORIES</text>

      <text x="460" y="134" font-size="56" font-weight="700" fill="url(#num)">
        6
        <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.30s" fill="freeze"/>
      </text>
      <text x="460" y="160" font-size="12" letter-spacing="3" fill="#565f89">LANGUAGES</text>

      <text x="864" y="134" font-size="56" font-weight="700" fill="url(#num)">
        4
        <animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.45s" fill="freeze"/>
      </text>
      <text x="864" y="160" font-size="12" letter-spacing="3" fill="#565f89">STARRED</text>
    </g>

    <rect x="56" y="188" width="1132" height="9" rx="4.5" fill="#161b22"/>
    <g>
      <rect x="56" y="188" width="0" height="9" rx="3" fill="#f7df1e">
        <animate attributeName="width" from="0" to="266" dur="0.9s" begin="0.55s" fill="freeze"/>
      </rect>
      <rect x="322" y="188" width="0" height="9" rx="3" fill="#89e051">
        <animate attributeName="width" from="0" to="199" dur="0.9s" begin="0.70s" fill="freeze"/>
      </rect>
      <rect x="521" y="188" width="0" height="9" rx="3" fill="#3572a5">
        <animate attributeName="width" from="0" to="199" dur="0.9s" begin="0.85s" fill="freeze"/>
      </rect>
      <rect x="720" y="188" width="0" height="9" rx="3" fill="#3178c6">
        <animate attributeName="width" from="0" to="199" dur="0.9s" begin="1.00s" fill="freeze"/>
      </rect>
      <rect x="919" y="188" width="0" height="9" rx="3" fill="#565f89">
        <animate attributeName="width" from="0" to="269" dur="0.9s" begin="1.15s" fill="freeze"/>
      </rect>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#a9b1d6">
      <circle cx="62" cy="226" r="4" fill="#f7df1e"/>
      <text x="74" y="230">JavaScript 24%</text>

      <circle cx="248" cy="226" r="4" fill="#89e051"/>
      <text x="260" y="230">Shell 18%</text>

      <circle cx="404" cy="226" r="4" fill="#3572a5"/>
      <text x="416" y="230">Python 18%</text>

      <circle cx="572" cy="226" r="4" fill="#3178c6"/>
      <text x="584" y="230">TypeScript 18%</text>

      <circle cx="774" cy="226" r="4" fill="#565f89"/>
      <text x="786" y="230">Others 22%</text>
    </g>
  </g>
</svg>
