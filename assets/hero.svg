<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="420" viewBox="0 0 1260 420" fill="none" role="img" aria-label="KeepAlive — Linux 运维 · 全栈工具开发">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1260" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#060911"/>
      <stop offset="0.42" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#080c17"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.14" cy="0.02" r="0.92">
      <stop offset="0" stop-color="#7aa2f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0.96" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowC" cx="0.78" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef4ff"/>
      <stop offset="0.40" stop-color="#7dcfff"/>
      <stop offset="0.64" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#eef4ff"/>
      <animate attributeName="x1" values="-0.7;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.3;2" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9ecbff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nodeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131a2c"/>
      <stop offset="1" stop-color="#0e1421"/>
    </linearGradient>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#161f36" stroke-width="1"/>
    </pattern>

    <clipPath id="card"><rect width="1260" height="420" rx="18"/></clipPath>

    <clipPath id="wipeA">
      <rect x="0" y="0" width="0" height="420">
        <animate attributeName="width" from="0" to="840" dur="1.7s" begin="0.25s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="wipeB">
      <rect x="0" y="0" width="0" height="420">
        <animate attributeName="width" from="0" to="680" dur="1.5s" begin="1.15s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="wipeC">
      <rect x="0" y="0" width="0" height="420">
        <animate attributeName="width" from="0" to="760" dur="1.3s" begin="1.85s" fill="freeze"/>
      </rect>
    </clipPath>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1260" height="420" fill="url(#bg)"/>
    <rect width="1260" height="420" fill="url(#grid)" opacity="0.45"/>
    <rect width="1260" height="420" fill="url(#glowA)"/>
    <rect width="1260" height="420" fill="url(#glowB)"/>
    <rect width="1260" height="420" fill="url(#glowC)"/>

    <rect x="0" y="0" width="1260" height="2.5" fill="url(#edge)" opacity="0.9">
      <animate attributeName="opacity" values="0.42;0.95;0.42" dur="3.4s" repeatCount="indefinite"/>
    </rect>

    <rect y="0" width="170" height="420" fill="url(#sheen)" opacity="0.09">
      <animate attributeName="x" from="-240" to="1340" dur="6.4s" begin="2.4s" repeatCount="indefinite"/>
    </rect>

    <!-- 左侧文案 -->
    <g clip-path="url(#wipeA)">
      <text x="64" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="5" fill="#7aa2f7" opacity="0.95">&#62; whoami</text>
      <text x="64" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="100" font-weight="700" letter-spacing="0" fill="url(#titleGrad)">KeepAlive</text>
    </g>

    <g clip-path="url(#wipeB)">
      <line x1="64" y1="216" x2="424" y2="216" stroke="url(#edge)" stroke-width="1.5" opacity="0.55"/>
      <text x="64" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" fill="#a9b1d6">Linux 运维 · 全栈工具开发</text>
    </g>

    <g clip-path="url(#wipeC)">
      <text x="64" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#6b7394">把重复劳动写成脚本，把想法做成能跑的东西。</text>
    </g>

    <!-- 底部指标条 -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#565f89">
      <circle cx="68" cy="356" r="3.2" fill="#9ece6a">
        <animate attributeName="opacity" values="1;0.22;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="82" y="360">AVAILABLE FOR WORK</text>

      <text x="286" y="360" fill="#3d4463">|</text>
      <text x="312" y="360">17 repos</text>
      <text x="400" y="360" fill="#3d4463">|</text>
      <text x="426" y="360">6 languages</text>
      <text x="546" y="360" fill="#3d4463">|</text>
      <text x="572" y="360">since 2021</text>
    </g>

    <!-- 右侧架构拓扑 -->
    <g>
      <g stroke="url(#edge)" stroke-width="1.6" opacity="0.32" stroke-linecap="round">
        <path d="M1000 176 V128"/>
        <path d="M928 208 H892"/>
        <path d="M1016 240 V296"/>
        <path d="M1064 240 L1100 296"/>
      </g>

      <g fill="#7dcfff">
        <circle r="3">
          <animateMotion dur="2.8s" repeatCount="indefinite" path="M1000,176 V128"/>
          <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle r="3">
          <animateMotion dur="3.4s" begin="0.4s" repeatCount="indefinite" path="M1000,128 V176"/>
          <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
        </circle>
        <circle r="2.6" fill="#9ece6a">
          <animateMotion dur="3s" begin="0.9s" repeatCount="indefinite" path="M928,208 H892"/>
        </circle>
        <circle r="2.6" fill="#bb9af7">
          <animateMotion dur="3.6s" begin="0.2s" repeatCount="indefinite" path="M1016,240 V296"/>
        </circle>
        <circle r="2.6" fill="#bb9af7">
          <animateMotion dur="4.2s" begin="1.2s" repeatCount="indefinite" path="M1064,240 L1100,296"/>
        </circle>
      </g>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
        <rect x="944" y="84" width="112" height="44" rx="10" fill="url(#nodeFill)" stroke="#233052" stroke-width="1.4"/>
        <text x="1000" y="111" font-size="13" fill="#7aa2f7">PXE</text>

        <rect x="790" y="186" width="102" height="44" rx="10" fill="url(#nodeFill)" stroke="#233052" stroke-width="1.4"/>
        <text x="841" y="213" font-size="13" fill="#9ece6a">WEB</text>

        <rect x="930" y="176" width="140" height="64" rx="12" fill="url(#nodeFill)" stroke="url(#edge)" stroke-width="1.8"/>
        <rect x="930" y="176" width="140" height="64" rx="12" fill="none" stroke="url(#edge)" stroke-width="6" opacity="0.16" filter="url(#soft)">
          <animate attributeName="opacity" values="0.08;0.26;0.08" dur="3.6s" repeatCount="indefinite"/>
        </rect>
        <text x="1000" y="205" font-size="14" fill="#e6edff" font-weight="700">CORE</text>
        <text x="1000" y="224" font-size="10.5" fill="#565f89">infra node</text>

        <rect x="960" y="296" width="112" height="44" rx="10" fill="url(#nodeFill)" stroke="#233052" stroke-width="1.4"/>
        <text x="1016" y="323" font-size="13" fill="#bb9af7">CEPH</text>

        <rect x="1100" y="296" width="112" height="44" rx="10" fill="url(#nodeFill)" stroke="#233052" stroke-width="1.4"/>
        <text x="1156" y="323" font-size="13" fill="#7dcfff">TOOL</text>
      </g>
    </g>

    <g fill="#7dcfff">
      <circle cx="712" cy="70" r="2.2"><animate attributeName="opacity" values="0.06;0.8;0.06" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1216" cy="392" r="2" fill="#bb9af7"><animate attributeName="opacity" values="0.06;0.7;0.06" dur="4s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="742" cy="382" r="1.6" fill="#9ece6a"><animate attributeName="opacity" values="0.06;0.7;0.06" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
