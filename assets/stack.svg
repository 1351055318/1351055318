<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="200" viewBox="0 0 1260 200" fill="none" role="img" aria-label="Tech Stack">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1260" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#0c1018"/>
